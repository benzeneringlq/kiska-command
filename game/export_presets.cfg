[preset.0]
name="Windows"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="*.json,*.f32,*.txt"
exclude_filter=""
export_path="../dist/windows/KiskaCommand.exe"

[preset.0.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=false
codesign/enable=false
application/modify_resources=false
debug/export_console_wrapper=0

[preset.1]
name="Linux"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter="*.json,*.f32,*.txt"
exclude_filter=""
export_path="../dist/linux/KiskaCommand.x86_64"

[preset.1.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=false
debug/export_console_wrapper=0

[preset.2]
name="macOS Universal"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter="*.json,*.f32,*.txt"
exclude_filter=""
export_path="../dist/macos-universal/Kiska Command.app"

[preset.2.options]
binary_format/architecture="universal"
application/bundle_identifier="io.github.benzeneringlq.kiska-command"
application/min_macos_version_x86_64="11.0"
application/min_macos_version_arm64="11.0"
codesign/codesign=3
codesign/identity="-"
codesign/entitlements/disable_library_validation=true
notarization/notarization=0
debug/export_console_wrapper=0
